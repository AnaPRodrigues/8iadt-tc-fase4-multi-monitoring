# Simulador local dos serviços de nuvem usados pelo sistema (LocalStack) --
# permite rodar tudo sem precisar de uma conta AWS de verdade.
# `make localstack-up` / `make localstack-down`.
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"          # porta única para todos os serviços simulados
    environment:
      - SERVICES=s3,lambda,sns,sqs,dynamodb,events,stepfunctions,cloudwatch,secretsmanager,apigateway,logs
      - DEBUG=0
      # Extração de texto de PDF e reconhecimento de imagem não têm simulador
      # disponível nesta versão gratuita do LocalStack -- o sistema usa uma
      # implementação local equivalente (Tesseract / detector próprio) nesse caso.
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"   # necessário para Lambda
